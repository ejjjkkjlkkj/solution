# Deterministic SCT platform profile for the pinned OVMF/QEMU CI target.
#
# This file describes capabilities intentionally present in the runtime VM.
# "no" means that capability is outside this headless CI platform and must not
# be misrepresented as implemented merely because upstream's sample profile
# defaults every optional feature to "yes".
[Test Configuration Specific]
GEN_CONFIG_INI_FILE_ON    = yes
IGNORE_COMPLIANT_TEST_CSV = no

[Platform Specific]
ConsoleDevices            = yes
HiiConfigSupport          = yes
HiiFontSupport            = yes
GraphicalConsoleDevices   = no
PointerDevices            = no
BootFromDiskDevices       = yes
BootFromNetworkDevices    = yes
ValidateBootImageThruNet  = no
UartDevices               = yes
PciBusSupport             = yes
UsbBusSupport             = yes
NVMExpressPassThru        = yes
BootFromNVMe              = yes
ExtScsiPassThru           = yes
DebugSupport              = no
PlatformDriverOverride    = no
AtaPassThru               = yes
UEFIIPv4Support           = yes
BootFromScsi              = yes
ExtScsiPassThruSupport    = yes
BootFromIScsi             = yes
EBCSupport                = no
UEFIIPv6Support           = no
VLANSupport               = yes
DNS4Support               = no
DNS6Support               = no
TLSSupport                = no
HTTPSupport               = no
EAPSupport                = no
BlueToothClassicSupport   = no
BlueToothLESupport        = no
IPSecSupport              = no
