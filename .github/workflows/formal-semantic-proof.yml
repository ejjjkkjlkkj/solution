name: Formal Semantic Proof
on:
  push:
    branches:
      - main
      - "dev/**"
  workflow_dispatch:

concurrency:
  group: formal-semantic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cbmc-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install CBMC 6.11.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download cbmc-6.11.0 --repo diffblue/cbmc --pattern 'ubuntu-24.04-cbmc-6.11.0-Linux.deb'
          sudo apt-get update
          sudo apt-get install -y ./ubuntu-24.04-cbmc-6.11.0-Linux.deb
          cbmc --version
      - name: Prove MM and accessibility postconditions
        run: |
          cbmc -Iinclude c/omni_protocol.c formal/cbmc_protocol.c             --bounds-check --pointer-check             --signed-overflow-check --unsigned-overflow-check             --div-by-zero-check --pointer-overflow-check             --unwinding-assertions

  frama-c-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Frama-C 33
        run: |
          sudo apt-get update
          sudo apt-get install -y opam libgmp-dev graphviz patch
          opam init --disable-sandboxing -y
          opam switch create 5.3.0 -y
          eval "$(opam env)"
          opam install -y frama-c.33.0 alt-ergo
          frama-c -version
      - name: Eva on implementation and contracts
        run: |
          eval "$(opam env)"
          frama-c -eva -eva-precision 4             -cpp-extra-args="-Iinclude"             c/omni_protocol.c formal/omni_protocol_acsl.c
      - name: WP semantic contracts and runtime safety
        run: |
          eval "$(opam env)"
          frama-c -wp -wp-rte -wp-prover alt-ergo             -cpp-extra-args="-Iinclude"             c/omni_protocol.c formal/omni_protocol_acsl.c 2>&1 | tee wp-semantic.log
          python - <<'PY'
          import re
          text=open("wp-semantic.log", encoding="utf-8").read()
          matches=re.findall(r"Proved goals:\s*(\d+)\s*/\s*(\d+)", text)
          if not matches:
              raise SystemExit("No Frama-C WP proof summary found")
          proved,total=map(int,matches[-1])
          print(f"Frama-C semantic proof: {proved}/{total}")
          if total == 0 or proved != total:
              raise SystemExit(f"Incomplete semantic proof: {proved}/{total}")
          PY

  formal-semantic-pass:
    runs-on: ubuntu-24.04
    needs: [cbmc-contract, frama-c-contract]
    steps:
      - run: echo "FORMAL_SEMANTIC_PROOF_PASS"
