name: Final Software Ceiling

on:
  push:
    branches:
      - main
      - "dev/**"
  workflow_dispatch:

concurrency:
  group: final-software-ceiling-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write

jobs:
  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e .

      - name: Wait for all required verification workflows on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 4800))
          while true; do
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" > workflow-runs.json
            python tools/ci_ceiling_manifest.py workflow-runs.json \
              --head-sha "$GITHUB_SHA" \
              --manifest-out ceiling-manifest.json \
              --details-out ceiling-details.json

            ready="$(python -c 'import json; print("true" if json.load(open("ceiling-details.json", encoding="utf-8"))["ready"] else "false")')"
            if [ "$ready" = "true" ]; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "SOFTWARE_INCOMPLETE: required workflow set did not complete before deadline" >&2
              cat ceiling-details.json >&2
              exit 1
            fi
            sleep 30
          done

      - name: Enforce closed software ceiling manifest
        run: omni software-ceiling ceiling-manifest.json

      - name: Seal the software/hardware boundary
        run: |
          omni hardware-boundary > hardware-boundary.json
          sha256sum ceiling-manifest.json ceiling-details.json workflow-runs.json hardware-boundary.json > final-evidence-sha256.txt
          grep -q '"status": "HARDWARE_ONLY"' hardware-boundary.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: final-software-ceiling-evidence
          path: |
            ceiling-manifest.json
            ceiling-details.json
            workflow-runs.json
            hardware-boundary.json
            final-evidence-sha256.txt

      - name: Attest final software-ceiling verdict
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            ceiling-manifest.json
            hardware-boundary.json
            final-evidence-sha256.txt
