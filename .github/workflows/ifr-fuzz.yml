name: IFR Parser Fuzz

on:
  push:
    branches:
      - main
      - "dev/**"
      - "chatgpt/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ifr-fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - name: Deterministic HII/IFR mutation campaign
        run: python tools/ifr_fuzz.py --cases 100000 --seed 1337 --json-out ifr-fuzz-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: ifr-fuzz-evidence
          path: ifr-fuzz-summary.json
