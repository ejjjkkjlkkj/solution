name: IFR Parser Fuzz

on:
  push:
    branches:
      - main
      - "dev/**"
      - "chatgpt/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ifr-fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - name: Deterministic HII/IFR mutation campaign
        run: python tools/ifr_fuzz.py --cases 100000 --seed 1337 --json-out ifr-fuzz-summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ifr-fuzz-evidence
          path: ifr-fuzz-summary.json
