name: IFR Parser Fuzz

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ifr-fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Deterministic HII/IFR mutation campaign
        run: python tools/ifr_fuzz.py --cases 100000 --seed 1337 --json-out ifr-fuzz-summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ifr-fuzz-evidence
          path: ifr-fuzz-summary.json
