name: CI Workflow Lint

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned actionlint 1.7.12
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -version
      - name: Validate workflows
        run: ./actionlint -color
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Enforce repository workflow policy
        run: python tools/workflow_policy.py .github/workflows --strict
      - name: Enforce immutable action pins
        run: python tools/verify_action_pins.py
      - name: Verify locked external toolchains
        run: python tools/verify_toolchain_lock.py
