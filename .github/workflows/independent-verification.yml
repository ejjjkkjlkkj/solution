name: Independent Software Ceiling Verification

on:
  push:
    branches:
      - "dev/software-ceiling-1.1.0"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-native-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Independent LLVM coverage
        run: |
          clang -std=c11 -Wall -Wextra -Wpedantic -Werror -fprofile-instr-generate -fcoverage-mapping -Iinclude c/omni_protocol.c tests/c/test_protocol.c -o coverage_test
          LLVM_PROFILE_FILE=coverage.profraw ./coverage_test
          llvm-profdata merge -sparse coverage.profraw -o coverage.profdata
          python tools/check_llvm_coverage.py ./coverage_test coverage.profdata

  independent-ovmf-launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - shell: bash
        run: |
          set -euo pipefail
          CODE="$(find /usr/share -type f \( -name 'OVMF_CODE.fd' -o -name 'OVMF_CODE_4M.fd' \) | head -1)"
          VARS="$(find /usr/share -type f \( -name 'OVMF_VARS.fd' -o -name 'OVMF_VARS_4M.fd' \) | head -1)"
          test -n "$CODE"; test -n "$VARS"
          cp "$VARS" "$RUNNER_TEMP/OVMF_VARS.fd"
          set +e
          timeout 8s qemu-system-x86_64 -machine q35,smm=on,accel=tcg -m 512 -nodefaults -display none -serial none -monitor none -drive if=pflash,format=raw,readonly=on,file="$CODE" -drive if=pflash,format=raw,file="$RUNNER_TEMP/OVMF_VARS.fd"
          rc=$?
          set -e
          if [ "$rc" -ne 124 ] && [ "$rc" -ne 0 ]; then exit "$rc"; fi

  independent-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: |
          mkdir -p /tmp/a /tmp/b
          python tools/deterministic_bundle.py /tmp/a/software-bundle.zip > /tmp/a/sha.txt
          python tools/deterministic_bundle.py /tmp/b/software-bundle.zip > /tmp/b/sha.txt
          cmp /tmp/a/software-bundle.zip /tmp/b/software-bundle.zip
          cmp /tmp/a/sha.txt /tmp/b/sha.txt
          python tools/build_provenance.py /tmp/a/software-bundle.zip /tmp/a/provenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: independent-reproducible-bundle
          path: |
            /tmp/a/software-bundle.zip
            /tmp/a/sha.txt
            /tmp/a/provenance.json

  independent-pass:
    runs-on: ubuntu-latest
    needs: [independent-native-coverage, independent-ovmf-launch, independent-reproducibility]
    steps:
      - run: echo "INDEPENDENT_SOFTWARE_VERIFICATION_PASS"
