name: UEFI SCT Runtime

on:
  push:
    branches:
      - main
      - "dev/**"
  workflow_dispatch:

concurrency:
  group: sct-runtime-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EDK2_TAG: edk2-stable202508
  EDK2_SHA: d46aa46c8361194521391aa581593e556c707c6e
  SCT_TAG: edk2-test-stable202509
  SCT_SHA: 2b2a16ac239cd89d778cb79ae6e42c533fc4c25a

jobs:
  sct-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm uuid-dev acpica-tools mtools dosfstools \
            ninja-build pkg-config libglib2.0-dev libpixman-1-dev zlib1g-dev \
            python3-venv wget gnupg xz-utils

      - name: Build signature-verified QEMU 11.1.1
        run: bash scripts/build_pinned_qemu.sh "$GITHUB_WORKSPACE/qemu-system-x86_64"

      - name: Checkout pinned EDK II and SCT
        run: |
          git clone --depth 1 --branch "$EDK2_TAG" --recurse-submodules https://github.com/tianocore/edk2.git
          test "$(git -C edk2 rev-parse HEAD)" = "$EDK2_SHA"
          git clone --depth 1 --branch "$SCT_TAG" https://github.com/tianocore/edk2-test.git
          test "$(git -C edk2-test rev-parse HEAD)" = "$SCT_SHA"
          cp -a edk2-test/uefi-sct/SctPkg ./SctPkg

      - name: Build official SCT
        run: |
          chmod +x SctPkg/build.sh
          ./SctPkg/build.sh X64 GCC RELEASE
          SCT_PACKAGE="$GITHUB_WORKSPACE/Build/UefiSct/RELEASE_GCC5/SctPackageX64"
          test -d "$SCT_PACKAGE/X64"
          test -f "$SCT_PACKAGE/SctStartup.nsh"
          test -f "$SCT_PACKAGE/X64/SCT.efi"

      - name: Build pinned OVMF and UEFI Shell
        run: |
          make -C edk2/BaseTools
          export WORKSPACE="$GITHUB_WORKSPACE/edk2"

          export EDK_TOOLS_PATH="$WORKSPACE/BaseTools"
          export CONF_PATH="$WORKSPACE/Conf"
          export PACKAGES_PATH="$WORKSPACE:$GITHUB_WORKSPACE/SctPkg"
          cd edk2
          export PYTHON_COMMAND=python3
          source edksetup.sh BaseTools
          build -a X64 -t GCC -b RELEASE -p OvmfPkg/OvmfPkgX64.dsc
          build -a X64 -t GCC -b RELEASE -p ShellPkg/ShellPkg.dsc
          OVMF_CODE="$(find Build -path '*/FV/OVMF_CODE.fd' | head -1)"
          OVMF_VARS="$(find Build -path '*/FV/OVMF_VARS.fd' | head -1)"
          SHELL_EFI="$(find Build -iname Shell.efi | head -1)"
          test -n "$OVMF_CODE"
          test -n "$OVMF_VARS"
          test -n "$SHELL_EFI"
          cp "$OVMF_CODE" "$GITHUB_WORKSPACE/OVMF_CODE.fd"
          cp "$OVMF_VARS" "$GITHUB_WORKSPACE/OVMF_VARS.fd"
          cp "$SHELL_EFI" "$GITHUB_WORKSPACE/Shell.efi"

      - name: Assemble disposable SCT disk
        run: |
          SCT_PACKAGE="$GITHUB_WORKSPACE/Build/UefiSct/RELEASE_GCC5/SctPackageX64"
          PAYLOAD_KB="$(du -sk "$SCT_PACKAGE/X64" | awk '{print $1}')"
          SIZE_MB=$(( (PAYLOAD_KB / 1024) + 256 ))
          if [ "$SIZE_MB" -lt 768 ]; then SIZE_MB=768; fi
          truncate -s "${SIZE_MB}M" sct-runtime.img
          mkfs.vfat -n SCTRUN sct-runtime.img
          mmd -i sct-runtime.img ::/EFI
          mmd -i sct-runtime.img ::/EFI/BOOT
          mmd -i sct-runtime.img ::/Sct
          mcopy -i sct-runtime.img Shell.efi ::/EFI/BOOT/BOOTX64.EFI
          mcopy -s -i sct-runtime.img "$SCT_PACKAGE/X64"/* ::/Sct/
          mcopy -i sct-runtime.img "$SCT_PACKAGE/SctStartup.nsh" ::/SctStartup.nsh
          printf 'verbose\n' > verbose.mode
          mcopy -i sct-runtime.img verbose.mode ::/Sct/.verbose.mode

          # Run the official SCT launcher directly as the Shell startup script.
          # The previous wrapper attempted to invoke fs0:\\SctStartup.nsh from
          # another script and then write a completion file from UEFI.  The
          # runtime evidence showed both operations failing before SCT started.
          cp "$SCT_PACKAGE/SctStartup.nsh" startup.nsh
          python3 - <<'PY'
          from pathlib import Path

          path = Path("startup.nsh")
          data = path.read_bytes()
          if b"OMNI_SCT_RETURNED" in data:
              raise SystemExit("unexpected pre-existing completion marker")
          if not data.endswith(b"\r\n"):
              data = data.rstrip(b"\r\n") + b"\r\n"
          path.write_bytes(data + b"echo OMNI_SCT_RETURNED\r\n")
          PY
          mcopy -i sct-runtime.img startup.nsh ::/startup.nsh

          # Fail closed before boot if the image does not contain the exact
          # launcher and completion marker we expect.
          mtype -i sct-runtime.img ::/startup.nsh > startup-from-image.nsh
          grep -a -q 'Sct -c' startup-from-image.nsh
          grep -a -q 'OMNI_SCT_RETURNED' startup-from-image.nsh
          mdir -i sct-runtime.img ::/
          mdir -i sct-runtime.img ::/Sct

      - name: Execute official SCT against pinned OVMF
        run: |
          cp OVMF_VARS.fd OVMF_SCT_VARS.fd
          rm -f sct-serial.log SCT-DONE.TXT

          "$GITHUB_WORKSPACE/qemu-system-x86_64" \
            -L "$GITHUB_WORKSPACE/qemu-system-x86_64.data" \
            -machine q35,accel=tcg \
            -m 2048 \
            -display none \
            -monitor none \
            -serial file:sct-serial.log \
            -net none \
            -drive if=pflash,format=raw,readonly=on,file=OVMF_CODE.fd \
            -drive if=pflash,format=raw,file=OVMF_SCT_VARS.fd \
            -drive file=sct-runtime.img,format=raw &
          QEMU_PID=$!

          cleanup_qemu() {
            if kill -0 "$QEMU_PID" 2>/dev/null; then
              kill -TERM "$QEMU_PID" 2>/dev/null || true
              wait "$QEMU_PID" 2>/dev/null || true
            fi
          }
          trap cleanup_qemu EXIT

          deadline=$((SECONDS + 3300))
          marker_seen=0
          while kill -0 "$QEMU_PID" 2>/dev/null; do
            if test -f sct-serial.log && grep -a -q 'OMNI_SCT_RETURNED' sct-serial.log; then
              marker_seen=1
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "SCT runtime timed out before the official launcher returned" >&2
              tail -200 sct-serial.log >&2 || true
              exit 1
            fi
            sleep 5
          done

          if [ "$marker_seen" -ne 1 ]; then
            set +e
            wait "$QEMU_PID"
            QEMU_RC=$?
            set -e
            echo "QEMU exited before the SCT completion marker: $QEMU_RC" >&2
            tail -200 sct-serial.log >&2 || true
            exit 1
          fi

          echo "SCT completion marker observed on serial output"
          grep -a 'OMNI_SCT_RETURNED' sct-serial.log
          printf 'OMNI_SCT_RETURNED\n' > SCT-DONE.TXT

          # Stop the emulator only after the official SCT launcher has returned.
          cleanup_qemu
          trap - EXIT

      - name: Extract and strictly analyze SCT results
        run: |
          mkdir -p sct-results
          mcopy -s -i sct-runtime.img ::/Sct/Overall sct-results/
          find sct-results -type f -maxdepth 3 -print
          SUMMARY_LOG="$(find sct-results -iname Summary.log | head -1)"
          SUMMARY_EKL="$(find sct-results -iname Summary.ekl | head -1)"
          test -n "$SUMMARY_LOG"
          test -n "$SUMMARY_EKL"
          test -s "$SUMMARY_LOG"
          test -s "$SUMMARY_EKL"
          python tools/sct_summary.py "$SUMMARY_LOG" --json-out sct-summary.json --strict

      - name: Hash runtime evidence
        if: always()
        run: |
          {
            if test -f SCT-DONE.TXT; then sha256sum SCT-DONE.TXT; fi
            if test -f sct-summary.json; then sha256sum sct-summary.json; fi
            if test -f sct-serial.log; then sha256sum sct-serial.log; fi
            find sct-results -type f -print0 2>/dev/null | sort -z | xargs -0 -r sha256sum
          } > sct-runtime-sha256.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: uefi-sct-runtime-evidence
          path: |
            SCT-DONE.TXT
            sct-summary.json
            sct-serial.log
            sct-runtime-sha256.txt
            sct-results/
